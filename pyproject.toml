[project]
name = "agent-team"
version = "0.1.0"
description = "Dispatcher for an autonomous product team of Claude Code roles: PO, developer, reviewer, analyst, marketer."
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0", "jsonschema>=4.22"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
team = "team.cli:main"
team-publish = "team.publish:main"
team-fetch = "team.fetch:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["team*"]

[tool.pytest.ini_options]
testpaths = ["tests"]          # never collect the product repos cloned under data/ and builds/ on the server

[tool.setuptools.package-data]
team = ["roles/*.md", "schemas/*.json", "templates/*"]
