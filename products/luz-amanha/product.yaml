slug: luz-amanha
name: Luz Amanhã
host: luz.bymachines.ai
site_base: https://luz.bymachines.ai
extra_hosts:
- threads.com
repo:
  url: https://github.com/formachines-ai/luz-amanha.git
  branch: main
  public_dir: public
channels:
  mastodon: '@formachines@mastodon.social'
  x: '@formachines_ai'
  threads: '@formachines'
  telegram: '@luz_amanha'
  bluesky: formachines.bsky.social
# Owner 10.11: the site promises a Telegram post every day (07:00 and ~14:05 UTC) — a product feature, not marketing,
# so Luz's own Telegram channel keeps the daily cap instead of the weekly one from team.yaml.
channel_caps:
  telegram: {per_day: 2}
targets:
- /tomorrow.json
- /go/telegram/
- /d/
- /feed.xml
- /go/vote/
- /ha/
budget_usd_per_day: 20
paused: false
geo_queries:
- preço da luz amanhã por hora Portugal
- horas mais baratas de eletricidade amanhã Portugal
- preço OMIE amanhã Portugal
- cheapest electricity hours tomorrow Portugal
- electricity price tomorrow Portugal per hour
langs:
- pt
- en
