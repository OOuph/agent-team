# agent-team — global settings. Per-product settings live in products/<slug>/product.yaml.
# Secrets never here: .env (TELEGRAM_BOT_TOKEN, BLUESKY_*, DEVTO_API_KEY, CLAUDE_CODE_OAUTH_TOKEN / ANTHROPIC_API_KEY).

paths:
  products_dir: products          # <slug>/ : VISION.md, product.yaml, backlog/, questions/, observations/, reviews/, digests/, metrics/, decisions.md
  data_dir: data                  # runs, work dirs, sqlite — never in git
  repos_dir: data/repos           # clones of the site repositories (one per product)

claude:
  binary: claude                  # overridden on the server by CLAUDE_BINARY in .env (…/node_modules/.bin/claude)
  auth: oauth_token               # oauth_token = CLAUDE_CODE_OAUTH_TOKEN (owner's plan, `claude setup-token`); api_key = ANTHROPIC_API_KEY
  timeout_s: 1500                 # hard cap of one role run
  inactivity_s: 300               # no stream-json line for this long → the run is killed (watchdog, Paperclip #18586 lesson)
  max_turns: 60
  models:
    po: opus
    developer: sonnet
    reviewer: sonnet
    analyst: sonnet
    marketer: sonnet
    persona: opus                   # owner 04.11: personas judge user experience, interest and value
    framework-retro: sonnet
    support: sonnet
    editor: sonnet
    reporter: sonnet                # 12-hour role report to the owner (team report)
    deputy: opus                    # deputy owner: answers owner questions by DEPUTY.md while the owner is away
    voice: opus                     # owner 07.11: weekly voice-of-user research, the PO ranks hypotheses on it

billing:                           # owner 04.11: "лимит расхода 100 в день, общий на всех; подписку не учитывай"
  daily_cap_usd_all: 100.0         # credits (real money) spent per UTC day by the whole team; runs inside the subscription are not counted

budget:                           # USD-equivalents from the CLI's total_cost_usd; with an OAuth token nothing is billed but the caps still hold
  max_usd_per_product_per_day: 20.0
  max_usd_per_run: 3.0
  min_usd_per_run: 0.3            # below this remaining daily budget no run is started
  unknown_cost_reserve_usd: 0.5   # a run without a reported cost is booked at this much
  warn_share: 0.8

cycle:
  review_after_min: 6             # a released task is reviewed once the droplet has had time to pull (timer every 5 min)
  measure_after_h: 24             # an accepted task is measured a day later
  max_review_fails: 2             # then the task is blocked and the owner hears about it
  persona_every_n_cycles: 12       # twice a day on Opus (was 6 on Sonnet)
  persona_scenarios_per_run: 2     # scenarios rotate run to run
  persona_cap_usd: 1.0
  digest_hours_utc: [7, 19]        # digests to the owner's ops channel (UTC)
  measure_every_h: 6              # analyst reads metrics this often (daily = 24); the supervised day 03.11 runs it 4x
  seo_every_h: 12                 # programmatic SEO/GEO page checks
  geo_every_h: 168                # weekly control questions to AI search
  voice_every_h: 84               # voice-of-user research per product twice a week (owner 08.11; team/voice.py)
  dev_idle_po_every_h: 12         # developer has nothing ready: the PO is woken this often to queue defect/quality work (owner 08.11; 12 h since 09.11)
  voice_cap_usd: 3.0
  max_ready: 3
  max_execute_per_cycle: 1        # one implementation task per product per cycle; WIP stays low
  execute_slots:                  # seats per role per cycle (overrides max_execute_per_cycle when present; product.yaml may override)
    developer: 1                  # 03.11: a single seat starved the daily post behind P1/P2 developer tasks
    marketer: 1
    analyst: 1

framework:                        # self-improvement: friction register → retro role → issues / pull requests on the framework repo
  retro_every_h: 1                # the retro role reads the register this often (0 = off); runs after the product cycles (owner 02.11: every cycle)
  repo: OOuph/agent-team          # where proposals are filed as issues (GITHUB_TOKEN needs issues:write on it)
  issues: true
  issue_label: friction
  product: agent-team             # product whose repo is the framework (repo.mode: pr): proposals become its tasks
  task_risks: [low, medium, high] # which proposals become tasks (owner 02.11: all; protected_paths still need a human)
  auto_merge: true                # tests green → canary cycle on the candidate code → merge by the dispatcher
  canary_product: release-radar   # the product whose cycle runs on the candidate code before merging
  protected_paths:                # a PR touching these waits for a human. Owner 03.11, decision 24a ("на этапе пилота
                                  # на риски не смотрим, максимальную автоматизацию делаем"): everything else merges
                                  # by itself after tests + canary; only the rollback pair stays — it is what undoes
                                  # a bad self-merge, so the automation itself depends on it.
    - run-cycle.sh
    - watchdog.sh
    - DEPUTY.md                   # the owner's mandate for the deputy role: his words, not the loop's
  max_usd_per_run: 2.0

gsc:                              # owner 10.11: Google Search Console via a service account (restricted user), `team gsc` daily
  enabled: true
  key_file: secrets/gsc.json      # outside git (secrets/ is ignored); the owner copies it to the server
  days: 28
  inspect_per_day: 50             # URL Inspection, random sample (owner 10.11): quota is 2,000/day per property, we use ≤ 150 on formachines.ai
  reinspect_days: 7

deputy:                           # decision 27 (04–10.11), kept by the owner 10.11: open owner questions are answered by the deputy role
  enabled: true
  after_h: 1                      # the owner gets this long to answer himself; then the deputy answers by DEPUTY.md

external_critic:                  # reports of an external critic (owner 03.11): findings → observation cards (team/critic.py)
  enabled: true
  dir: /home/ubuntu/formachines-external-critic/reports
  author: external critic (Codex, gpt-6-astra)
  default_product: agent-team     # findings that name no product, and reports without findings, go here
  responses_dir: /home/ubuntu/formachines-external-critic/context   # agent-team-responses.json: what we did with each finding (REPORT_FORMAT.md §4)

fetch:                            # what team-fetch may open, beyond the product site and the publishing channels
  extra_hosts_by_role:            # per role; the reviewer reads repo-only deliverables (code, tests, README) on GitHub
    reviewer: [github.com, raw.githubusercontent.com, api.github.com]
    support: [github.com, api.github.com]
    marketer: [github.com, raw.githubusercontent.com]   # posts about the framework cite its public repo (04.11)
    editor: [github.com, raw.githubusercontent.com]

support:                          # answers to people within VISION (role support), see team/support.py
  enabled: true
  max_replies_per_day: 10
  max_per_cycle: 3
  ignore_authors: [OOuph, formachines.bsky.social, formachines]

editorial:
  series:                          # owner 04.11: the daily article series is edited very critically
    title_prefixes: ["Pivots "]    # task titles of the series
    editor_model: opus
    marketer_model: opus
    rounds: 3                      # the editor may return a draft twice
    min_axis: 4                    # every axis ≥ 4 and mean ≥ 4.3, enforced in code
    min_mean: 4.3
    editor_cap: 1.5
    marketer_cap: 2.5
    rubric_file: docs/notes/series-editorial-rubric.md

publish:
  # Disclosure only where a rule requires it (owner 02.11): the account bio / channel description and the site footer
  # carry the full statement; a post gets the short tag, a dev.to article the full line (dev.to content policy).
  disclosure:
    default: "🤖 AI agent · formachines.ai"
    devto: "Written and published by an AI agent (agent-team) without human editing. Responsible: Dmitry, formachines.ai."
    telegram: "🤖 AI agent · formachines.ai"
    bluesky: "🤖 AI agent · formachines.ai"
  max_posts_per_channel_per_day: 2
  # Owner 10.11, data 02–10.11 over all sites (people who came by ?src=): X ~23 from 24 posts, Bluesky 8/46,
  # Telegram 3/46, Mastodon 3/11, Threads 1/16, dev.to 0/4. X stays daily; the rest get the strongest item only.
  # Per product (X, Bluesky, Mastodon, Threads are shared accounts: four products → up to 4× these numbers there).
  channel_caps:
    x: {per_day: 1}   # card: 1/day at most; the X account is shared, so 4 products → ≤ 4/day in all
    bluesky: {per_week: 2}
    telegram: {per_week: 2}
    mastodon: {per_week: 1}
    threads: {per_week: 1}
    devto: {per_week: 1}
  dry_run: false

deploy:
  mode: git_pull                  # the droplet pulls the site repo and publishes public/ (deploy/droplet/); ssh_rsync when a key is authorized
  droplet_host: root@68.183.2.193
