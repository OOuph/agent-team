# agent-team — global settings. Per-product settings live in products/<slug>/product.yaml.
# Secrets never here: .env (TELEGRAM_BOT_TOKEN, BLUESKY_*, DEVTO_API_KEY, CLAUDE_CODE_OAUTH_TOKEN / ANTHROPIC_API_KEY).

paths:
  products_dir: products          # <slug>/ : VISION.md, product.yaml, backlog/, questions/, observations/, reviews/, digests/, metrics/, decisions.md
  data_dir: data                  # runs, work dirs, sqlite — never in git
  repos_dir: data/repos           # clones of the site repositories (one per product)

claude:
  binary: claude                  # overridden on the server by CLAUDE_BINARY in .env (…/node_modules/.bin/claude)
  auth: oauth_token               # oauth_token = CLAUDE_CODE_OAUTH_TOKEN (owner's plan, `claude setup-token`); api_key = ANTHROPIC_API_KEY
  timeout_s: 1500                 # hard cap of one role run — the default for every role (per role and per product: `roles` below)
  inactivity_s: 300               # no stream-json line for this long → the run is killed (watchdog, Paperclip #18586 lesson)
  max_turns: 60
  # Time budget per role (owner 21.11, frictions F23/F30; SCHEME §3 «Бюджет времени, продолжение и профиль прогона»).
  # Layers, the later one wins: timeout_s / inactivity_s above → roles.<role> → roles_by_repo_kind.<repo.kind>.<role>
  # → product.yaml `roles: {<role>: {timeout_s, inactivity_s}}`. Hard ceiling 3600 s (team/config.py
  # RUN_TIMEOUT_CEILING_S): a higher value is clamped with a WARNING. The effective limit is in the log and in run.json.
  roles: {}                       # e.g. designer: {timeout_s: 1800}   reviewer: {inactivity_s: 420}
  roles_by_repo_kind:             # defaults by `repo.kind` of the product (static / service)
    service:
      developer: {timeout_s: 2700}   # a service repository: install, build, start the server and play e2e specs in one run (was 1500)
  models:
    po: opus
    developer: sonnet
    reviewer: sonnet
    analyst: sonnet
    marketer: sonnet
    persona: opus                   # owner 04.11: personas judge user experience, interest and value
    framework-retro: sonnet
    support: sonnet
    editor: sonnet
    reporter: sonnet                # 12-hour role report to the owner (team report)
    deputy: opus                    # deputy owner: answers owner questions by DEPUTY.md while the owner is away
    voice: opus                     # owner 07.11: weekly voice-of-user research, the PO ranks hypotheses on it
    onboarding: opus                # owner 20.11: brief → questions and accounts → VISION and backlog (team onboard), twice per product
    designer: sonnet                # owner 20.11, game profile: DESIGN.md, CSS tokens, SVG assets in the repository (same path as developer)
    game-designer: opus             # owner 20.11, game profile: GAME-DESIGN.md and balance tables → design-spec; the PO cuts it into tasks
    tester: sonnet                  # owner 20.11, game profile: plays a released task in browsers (Playwright via team-play) in the review phase

billing:                           # owner 04.11: "лимит расхода 100 в день, общий на всех; подписку не учитывай"
  daily_cap_usd_all: 100.0         # credits (real money) spent per UTC day by the whole team; runs inside the subscription are not counted

budget:                           # USD-equivalents from the CLI's total_cost_usd; with an OAuth token nothing is billed but the caps still hold
  max_usd_per_product_per_day: 20.0
  max_usd_per_run: 3.0
  run_caps: {}                    # cap of ONE run per role, USD, e.g. {po: 6.0}: replaces the caller's own cap (the PO's $2, a task's
                                  # budget_usd, max_usd_per_run). Set it together with a dearer model for the role; product.yaml
                                  # `run_caps: {<role>: N}` overrides per product. The daily cap of the product still holds.
  min_usd_per_run: 0.3            # below this remaining daily budget no run is started
  unknown_cost_reserve_usd: 0.5   # a run without a reported cost is booked at this much
  warn_share: 0.8

cycle:
  review_after_min: 6             # a released task is reviewed once the droplet has had time to pull (timer every 5 min)
  measure_after_h: 24             # an accepted task is measured a day later
  max_review_fails: 2             # then the task is blocked and the owner hears about it
  persona_every_h: 12              # hours between persona runs per product: twice a day on Opus; 0 = off. Last run:
                                   # products/<slug>/personas-last.json (was persona_every_n_cycles, still read as hours)
  persona_retry_h: 3               # a persona run that brought no result is tried again this soon
  persona_scenarios_per_run: 2     # scenarios rotate run to run
  persona_cap_usd: 1.0
  digest_hours_utc: [7, 19]        # digests to the owner's ops channel (UTC)
  measure_every_h: 6              # analyst reads metrics this often (daily = 24); the supervised day 03.11 runs it 4x
  seo_every_h: 12                 # programmatic SEO/GEO page checks
  geo_every_h: 168                # weekly control questions to AI search
  voice_every_h: 84               # voice-of-user research per product twice a week (owner 08.11; team/voice.py)
  dev_idle_po_every_h: 12         # developer has nothing ready: the PO is woken this often to queue defect/quality work (owner 08.11; 12 h since 09.11)
  voice_cap_usd: 3.0
  max_ready: 3
  max_execute_per_cycle: 1        # one implementation task per product per cycle; WIP stays low
  max_continuations: 3            # owner 21.11: a developer/designer run stopped by the time limit is continued next cycle from a `wip:` commit on
                                  # task/<id>; after this many continuations the task is blocked and the PO is asked to split it
                                  # (product.yaml `cycle: {max_continuations: N}` overrides; 0 = never continue)
  parallel:                       # owner 21.11 (frictions F21, F29): role runs of one product's cycle overlap — team/lanes.py, SCHEME §3
    enabled: true                 # the reviews run beside triage and execution, every seat below is its own lane, a repository role
                                  # works in its own git worktree of the task (data/work/<slug>/wt/<task id>).
                                  # false = the strictly sequential cycle of before 21.11 (the worktrees stay)
    max_runs: 3                   # lanes at once inside ONE product's cycle, the PO's own run included (1..8). The subscription's rate
                                  # limits and the host's CPU are shared with the cycles of the other products
    review_max_runs: 2            # of them reviews / play-tests at most (default max_runs - 1, at least 1): a slot always stays for execution
    overlap_roles: []             # roles whose several seats (execute_slots.<role> > 1) work at once; [] = tasks of one role one after another
    max_merge_conflicts: 2        # merge conflicts in a row on one task (two tasks keep changing the same lines) → blocked, question to the PO
    worktree_keep_h: 72           # a blocked / deferred / waiting_owner task keeps its checkout this long; its branch stays for ever
    workdir_keep_h: 24            # a finished cycle keeps the clones of its reviews and play-tests (data/work/<slug>/<cycle>/*/checkout,
                                  # */tests-run, every node_modules) this long; the folder and its logs stay for ever
                                  # (product.yaml `cycle: {parallel: {max_runs: 2}}` overrides key by key; `parallel: false` switches it off)
  po_prompt:                      # owner 26.11, rework slice 1: what the PO's prompt carries (team/prompts.py); a product switches it on
    compact_finished: false       # in product.yaml `cycle: {po_prompt: {...}}`. true = accepted / released / measured tasks as a card
    stable_first: false           # (id, title, state, …, one line of the last result); true = VISION first, cycle number and spend last
  escalation:                     # owner 26.11, rework slice 2: a role that lacks what its task needs asks instead of guessing
    needs_context: false          # true = its `needs_context` result is one question to the PO, the task waits, the stop is not a
                                  # failure, and the answer travels to the role; false = the old `blocked` + `question` path
    review_return: false          # true = the third unproven review returns the same task to its role with the reason word and what
                                  # to do (an environment reason retries the review); false = blocked + a PO question
  duplicates:                     # owner 26.11, rework slice 3: work re-created under a new id
    closed_list: false            # true = the PO's prompt lists tasks closed in the last 7 days (id, state, title, one line of why)
    closed_check: false           # true = a proposal titled like finished work is skipped; like a rejected task — linked with `continues`
  guards:                         # owner 26.11, rework slice 4: what stops a run that goes wrong, beside the time limit and inactivity
    loop: false                   # true = a run that repeats one tool call with the same input and the same output is stopped …
    loop_repeats: 5               # … after this many identical calls in a row (a changing output = waiting, not a loop)
    cost: false                   # true = the cap of a run is at most cost_factor × the role's median spend per run
    cost_factor: 8                # over the last cost_days days, when the role has at least cost_min_runs runs there,
    cost_min_runs: 20             # and never below cost_floor_usd
    cost_days: 7
    cost_floor_usd: 1.0
  visible:                        # owner 26.11, rework slice 5 (docs/review-before-deploy.md): a visible change is judged before players see it
    review_before_merge: false    # true = a task marked `visible` is reviewed on its branch (local server) and merged only by a pass
    redesign_gate: false          # true = a task marked `redesign` without `new_function` is not created (nobody is asked)
  queue:                          # owner 26.11, rework slice 9: the PO cuts tasks ahead
    ahead: false                  # true = the PO is also woken when the developer's ready queue is below target_ready …
    target_ready: 6
    max_per_run: 6                # … and may propose this many Ready tasks in one run (off: max_ready, three)
    wake_every_min: 30            # not woken for a low queue more often than this
  analyst_prompt:                 # 26.11, rework slice 10: recently accepted tasks in the analyst's prompt
    compact_tasks: false          # true = a card per task (id, title, type, goal, accepted_at, one line of the last result)
  measure:                        # owner 26.11, rework slice 11: the day is measured, not every task
    by_day: false                 # true = accepted tasks close by themselves (no-metric ones at once, the rest after measure_after_h);
                                  # the analyst gives a day-to-day summary only; its failed run is not repeated in the same window
  game_designer:                  # 26.11, rework slice 12: what the game designer's run can read
    checkout: false               # true = a read-only checkout of the base branch as its working folder, with Read / Glob / Grep
  review_tests:                   # 27.11: the test step before a review
    skip_for_docs: false          # true = a commit that changes only .md / .txt files is reviewed without the tests and without a play-test
  node_cache:                     # 27.11 (team/nodecache.py): a ready node_modules per package-lock.json
    enabled: false                # true = a checkout without node_modules gets a copy from the cache; commands run without `npm ci`
  flow:                           # owner 25.11 («если у нас так простои постоянно, то надо что-то менять»): continuous work of the seats —
                                  # team/flow.py, SCHEME §3 «Непрерывная работа мест». Off here; a product in active development switches
                                  # it on in product.yaml: `cycle: {flow: {refill: true, chain: true}}` (overrides key by key)
    refill: false                 # true = a seat that finished its task takes the next startable one inside the same execute phase;
                                  # `execute_slots` then means «places working at once», not «tasks per cycle»
    refill_min: 20                # … until the execute phase is this many minutes old; nothing new starts later, so the cycle is not held
                                  # longer than one long run holds it anyway
    refill_max_min: 60            # past refill_min refill stays open while reviews of the cycle still run or wait for a slot (the cycle
                                  # is held by them anyway), but never after the phase is this old
    refill_keep_on_failure: false # true = a run that failed for its own reason (its cap, the time limit) does not close refill;
                                  # an outage or three failed runs in a cycle still do
    refill_while_running: false   # true = past refill_min refill stays open while another execute seat is still at work
    early_execute: false          # true = the seats start on the tasks ready at the START of the cycle, beside collect and the PO
    chain: false                  # true = `team cycle --due` starts the next cycle right after one that carried a task through, while
                                  # startable work waits (no 5–10 min pause until cron looks again)
    chain_max: 6                  # cycles of one product in one process; then cron and cycle.every_min decide
    chain_pause_s: 5              # between two chained cycles NO lock is held this long: the window of an operator script that waits
                                  # for data/locks/product-<slug>.lock, and of a code update at the gate
    chain_lock_wait_s: 120        # the next chained cycle waits this long for whoever took the product lock in that window
    max_utilization: 1.0          # refill and chain are off while the subscription's weekly window is above this share (1.0 = no ceiling)
    on_credits: false             # false = refill and chain are off while the team runs on bought credits (real money)
  execute_slots:                  # seats per role per cycle (overrides max_execute_per_cycle when present; product.yaml may override)
    developer: 1                  # 03.11: a single seat starved the daily post behind P1/P2 developer tasks
    marketer: 1
    analyst: 1
    designer: 1                     # game profile (owner 20.11); a site product simply never has tasks of these roles
    game-designer: 1

locks:                            # team/locks.py, SCHEME §3 «Блокировки циклов» (friction F17): cycles of different products run side by side
  start_wait_s: 20                # a starting cycle waits this long when the code lock is held exclusively for a moment (watchdog rollback, `flock data/cycle.lock …`); a closed gate is never waited for
  code_update_wait_s: 1800        # the self-merge waits this long for the running cycles of the other products before it fast-forwards the dispatcher checkout
  restore_wait_s: 300             # after its own code update the cycle waits this long to hold the code lock shared again
  canary_state_wait_s: 120        # the canary waits this long for the canary product's own cycle before copying its state
  poll_s: 1.0                     # step of the waits above

framework:                        # self-improvement: friction register → retro role → issues / pull requests on the framework repo
  retro_every_h: 1                # the retro role reads the register this often (0 = off); runs after the product cycles (owner 02.11: every cycle)
  repo: OOuph/agent-team          # where proposals are filed as issues (GITHUB_TOKEN needs issues:write on it)
  issues: true
  issue_label: friction
  product: agent-team             # product whose repo is the framework (repo.mode: pr): proposals become its tasks
  task_risks: [low, medium, high] # which proposals become tasks (owner 02.11: all; protected_paths still need a human)
  auto_merge: true                # tests green → canary cycle on the candidate code → merge by the dispatcher
  canary_product: release-radar   # the product whose cycle runs on the candidate code before merging
  protected_paths:                # a PR touching these waits for a human. Owner 03.11, decision 24a ("на этапе пилота
                                  # на риски не смотрим, максимальную автоматизацию делаем"): everything else merges
                                  # by itself after tests + canary; only the rollback pair stays — it is what undoes
                                  # a bad self-merge, so the automation itself depends on it.
    - run-cycle.sh
    - watchdog.sh
    - DEPUTY.md                   # the owner's mandate for the deputy role: his words, not the loop's
  instructions:                   # owner 26.11, rework slice 8 (team/instructions.py): the roles' instructions change only through the owner
    owner_only: true              # owner 26.11 (point 9: «правка только через владельца, пачкой раз в неделю»); switched on at the end of the
                                  # rework. true = a PR touching these paths waits for the owner; a retro role-card proposal and the editor's
                                  # lessons are kept as «было → стало» files; the owner gets one list of the pending ones
    paths: [team/roles/, DEPUTY.md]
    digest_every_days: 7
  guard:                          # owner 26.11, rework slice 7 (team/canary.py); both off = the merge rule of before
    canary_report: true           # owner 26.11 (point 3). true = the merge reads the canary's report back: none, unparsable, another revision, older than
                                  # this run, failed or empty → no merge, the PR waits for the owner
    tests_strict: true            # owner 26.11 (point 2). true = a PR that changes or deletes EXISTING test lines, or the canary / merge-gate code, waits for
                                  # the owner (one line to the ops chat); new files and new lines under tests/ merge by themselves
  max_usd_per_run: 2.0

gsc:                              # owner 10.11: Google Search Console via a service account (restricted user), `team gsc` daily
  enabled: true
  key_file: secrets/gsc.json      # outside git (secrets/ is ignored); the owner copies it to the server
  days: 28
  inspect_per_day: 50             # URL Inspection, random sample (owner 10.11): quota is 2,000/day per property, we use ≤ 150 on formachines.ai
  reinspect_days: 7

run_profile:                      # owner 21.11: where the time of a run went (team/runprofile.py; no model call). product.yaml `run_profile` overrides.
  enabled: true                   # the profile goes into run.json of every run; `team task <slug> show --id T` prints it
  event_min_s: 300                # a run at least this long, or stopped by a limit, also gets the `run.profile` event → one line in the PO prompt
  top_calls: 5                    # longest calls kept (first 160 characters, secrets redacted)
  repeat_threshold: 3             # flag: the same normalised command more than this many times
  dominant_share: 0.6             # flag: one category above this share of the time inside tool calls (and ≥ dominant_min_s = 120 s)
  max_full_e2e: 1                 # flag: more than this many full e2e runs (no spec file, no grep filter)
  extra_categories: []            # rules in front of the built-in ones (install, e2e, unit_tests, build, git, read_search, edit, shell, other),
                                  # e.g. - {name: e2e, tools: [Bash], pattern: '\bmake play-test\b'}; `categories:` replaces the whole list

replan:                           # owner 11.11: a goal stuck N times → the PO gives 3 alternatives → probes → the owner (team/replan.py)
  threshold: 3                    # failed attempts (partial/blocked/error/no commit) over the chain of tasks of one goal
  probe_budget_usd: 1.5           # cap per probe run
  tried_max: 8                    # lines of «already tried» shown to the PO and the owner

deputy:                           # decision 27 (04–10.11), kept by the owner 10.11: open owner questions are answered by the deputy role
  enabled: true
  after_h: 1                      # the owner gets this long to answer himself; then the deputy answers by DEPUTY.md

external_critic:                  # reports of an external critic (owner 03.11): findings → observation cards (team/critic.py)
  enabled: true
  dir: /home/ubuntu/formachines-external-critic/reports
  author: external critic (Codex, gpt-6-astra)
  default_product: agent-team     # findings that name no product, and reports without findings, go here
  responses_dir: /home/ubuntu/formachines-external-critic/context   # agent-team-responses.json: what we did with each finding (REPORT_FORMAT.md §4)

fetch:                            # what team-fetch may open, beyond the product site and the publishing channels
  extra_hosts_by_role:            # per role; the reviewer reads repo-only deliverables (code, tests, README) on GitHub
    reviewer: [github.com, raw.githubusercontent.com, api.github.com]
    support: [github.com, api.github.com]
    marketer: [github.com, raw.githubusercontent.com]   # posts about the framework cite its public repo (04.11)
    editor: [github.com, raw.githubusercontent.com]

support:                          # answers to people within VISION (role support), see team/support.py
  enabled: true
  max_replies_per_day: 10
  max_per_cycle: 3
  ignore_authors: [OOuph, formachines.bsky.social, formachines]

editorial:
  series:                          # owner 04.11: the daily article series is edited very critically
    title_prefixes: ["Pivots "]    # task titles of the series
    editor_model: opus
    marketer_model: opus
    rounds: 3                      # the editor may return a draft twice
    min_axis: 4                    # every axis ≥ 4 and mean ≥ 4.3, enforced in code
    min_mean: 4.3
    editor_cap: 1.5
    marketer_cap: 2.5
    rubric_file: docs/notes/series-editorial-rubric.md

publish:
  # Disclosure only where a rule requires it (owner 02.11): the account bio / channel description and the site footer
  # carry the full statement; a post gets the short tag, a dev.to article the full line (dev.to content policy).
  disclosure:
    default: "🤖 AI agent · formachines.ai"
    devto: "Written and published by an AI agent (agent-team) without human editing. Responsible: Dmitry, formachines.ai."
    telegram: "🤖 AI agent · formachines.ai"
    bluesky: "🤖 AI agent · formachines.ai"
  max_posts_per_channel_per_day: 2
  # Owner 10.11, data 02–10.11 over all sites (people who came by ?src=): X ~23 from 24 posts, Bluesky 8/46,
  # Telegram 3/46, Mastodon 3/11, Threads 1/16, dev.to 0/4. X stays daily; the rest get the strongest item only.
  # Per product (X, Bluesky, Mastodon, Threads are shared accounts: four products → up to 4× these numbers there).
  channel_caps:
    x: {per_day: 1}   # card: 1/day at most; the X account is shared, so 4 products → ≤ 4/day in all
    bluesky: {per_week: 2}
    telegram: {per_week: 2}
    mastodon: {per_week: 1}
    threads: {per_week: 1}
    devto: {per_week: 1}
  dry_run: false

deploy:
  mode: git_pull                  # the droplet pulls the site repo and publishes public/ (deploy/droplet/); ssh_rsync when a key is authorized
  droplet_host: root@68.183.2.193
