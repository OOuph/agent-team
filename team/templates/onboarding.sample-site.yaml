# Fixture for `team onboard --profile site --dry-run` and the tests (owner 26.11: a static site, not a game):
# what the onboarding role would answer for a small statistics site. No model run, no accounts, no network.
# Keys follow the two schemas, same as onboarding.sample.yaml.
questions:
  summary: >-
    Статический сайт со статистикой: страница на каждый вопрос «как часто команда проходит линию», текст в HTML,
    данные раз в день из платного источника. Тест поискового трафика, деньги не меряем.
  proposed_name: Demo Stats
  questions:
    - id: Q1
      topic: audience
      question: По каким запросам должен приходить читатель — по команде, по лиге или по матчу?
      why: какие типы страниц строить первыми
      options: ["команда × метрика", "лига", "матч"]
      default: команда × метрика
    - id: Q2
      topic: ops
      question: Как скоро после матча страница должна обновиться?
      why: расписание сборщика данных
      default: раз в сутки, ночью
    - id: Q3
      topic: scope
      question: Что для вас «первые страницы» — одна лига целиком или по странице в каждой лиге?
      why: граница первой недели
      default: одна лига целиком
  accounts:
    - id: A1
      what: ключ платного источника данных
      why: без него только тестовые данные прошлых сезонов
      needed_by: W1
      without_it: сборщик и страницы строятся на тестовом ключе, без публикации
      who_creates: owner
      hand_over: "имя переменной DATA_API_KEY в .env сервера"
    - id: A2
      what: репозиторий сайта
      why: ветки задач, merge, выкладка из git
      needed_by: W1
      without_it: ничего — команда создаёт сама
      who_creates: team
      hand_over: "URL в product.yaml repo.url"
    - id: A3
      what: Search Console на домене
      why: порог теста считается по индексу и показам
      needed_by: W1
      without_it: sitemap отдаётся, но показы не видны
      who_creates: owner
      hand_over: "подтверждение домена"
  assumptions:
    - Сайт статический, собирается заранее и лежит в public/.
    - Сырые данные источника наружу не передаются.
  risks:
    - Однотипные страницы поисковик может счесть массовой генерацией.

plan:
  vision_md: |
    # Demo Stats — VISION

    **Статус:** черновик из онбординга (сухой прогон, профиль site); утверждает владелец.

    ## Что это
    Статический сайт: страница на каждый вопрос «как часто команда проходит линию», цифра в заголовке, текст в HTML.

    ## Для кого и зачем
    | Пользователь | Приходит с | Получает | Успех |
    |---|---|---|---|
    | болельщик | поискового запроса по команде | ответ цифрой и разбивку | дочитал таблицу |

    ## Что обещаем и чего не обещаем
    - На каждой странице дата данных и источник. Без форм и трекинга людей.
    - Чего не делаем: коэффициенты, ссылки на букмекеров, SPA.

    ## Ежедневная работа команды
    Данные обновляются раз в сутки; день без обновления — дефект P1.

    ## Цели на тест — читаются аналитиком
    | id | Метрика | Определение | База | Цель | Как считаем |
    |---|---|---|---|---|---|
    | G1 | индекс | страниц в индексе Google | 0 | 300 к 8-й неделе | Search Console |
    | G2 | показы | показов за 4 недели | 0 | 2 000 | Search Console |

    ## Каналы и тон
    Каналов нет до аккаунтов владельца. Тон спокойный, цифры без призывов.

    ## Глубина доработок (владелец задаёт предел: L0–L4)
    L0 данные каждый день · L1 дефекты · L2 новые страницы по запросам · L3 llms.txt и JSON · L4 — только владелец.

    ## Разрешения ролей (решение владельца)
    Разработчик — код на ветке задачи · диспетчер — merge и публикация после тестов · только владелец — цели, аккаунты, деньги.

    ## Бюджет
    ≤ $15/день на модели; `STOP` в папке продукта останавливает цикл.
  game_design_md: ""
  product:
    profile: site
    stage: W1
    stack: Python 3 static generator; output in public/
    repo:
      kind: static
      url: ""
      build_cmd: python3 build.py
      test_cmd: python3 -m pytest -q
    deploy:
      mode: git_pull
  backlog:
    - title: "Сборщик данных с проверками качества на тестовом ключе"
      type: ops
      role: developer
      priority: P1
      size: M
      problem: Страницам нужен снимок данных; часть матчей приходит с пропусками и расхождениями.
      scope: collect.py, data/snapshot/, tests/test_collect.py
      acceptance:
        - "тест: матч с угловыми −1 помечен и не попадает в расчёт"
      negative_cases: []
      goal: W1
      state: ready
      repo_only: true
    - title: "Генератор страниц и шаблоны текста"
      type: feature
      role: developer
      priority: P1
      size: M
      problem: Нужны готовые HTML-страницы с цифрой в заголовке.
      scope: build.py, templates/, public/
      acceptance:
        - "в public/ у каждой страницы цифра в <h1> без JS, дата данных и источник"
      negative_cases: []
      goal: W1
      depends_on: ["Сборщик данных с проверками качества на тестовом ключе"]
      state: ready
    - title: "Переход на платный ключ данных"
      type: ops
      role: developer
      priority: P1
      size: S
      problem: Тестовый ключ даёт только прошлые сезоны.
      scope: collect.py
      acceptance:
        - "сборщик берёт текущий сезон по ключу из .env сервера"
      negative_cases: []
      goal: W1
      state: deferred
      return_condition: владелец положил ключ (A1) в .env сервера
  decisions:
    - "Q1 по умолчанию: команда × метрика"
    - "Q2 по умолчанию: раз в сутки, ночью"
    - "Q3 по умолчанию: одна лига целиком"
    - "A1 — позже: переход на платный ключ в deferred"
  owner_summary_md: |
    Сначала сборщик данных и генератор страниц на тестовом ключе; публикация и текущий сезон ждут платный ключ (A1). Ориентир расхода: $5–10 в день при капе $15.
