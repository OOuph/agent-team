# Fixture for `team onboard --dry-run` and the tests: what the onboarding role would answer for
# team/templates/onboarding.sample-brief.md. No model run, no accounts, no network. Keys follow the two schemas.
questions:
  summary: >-
    Пошаговая тактика 1 на 1 в браузере: поле 8×8, по пять кораблей с разной дальностью хода и выстрела, партия
    ~10 минут, вход по коду комнаты без регистрации, телефон — равноправная платформа. Ник и рейтинг — позже.
  proposed_name: Два флота
  questions:
    - id: Q1
      topic: session
      question: Что происходит, если один игрок закрыл вкладку посреди партии — ждём его, засчитываем поражение, партия пропадает?
      why: определяет, нужно ли хранить состояние комнаты дольше соединения уже на M0
      options: ["ждём 2 минуты, потом поражение", "партия пропадает", "ждём сколько угодно"]
      default: ждём 2 минуты, потом поражение
    - id: Q2
      topic: loop
      question: Чем кончается партия — уничтожением всех кораблей соперника или есть лимит ходов?
      why: условие победы и защита от бесконечной партии
      options: ["все корабли", "все корабли или 40 ходов — по оставшимся"]
      default: все корабли или 40 ходов — по оставшимся
    - id: Q3
      topic: platform
      question: Телефон — только портретная ориентация или и альбомная? Минимальная ширина экрана?
      why: раскладка поля 8×8 и панели кораблей
      options: ["портрет, 360 px", "обе"]
      default: портрет, 360 px
    - id: Q4
      topic: tone
      question: Тон и сеттинг — условные корабли без «войны» (шахматный тон) или военно-морской с названиями?
      why: тексты, иконки, страница правил
      default: условные корабли, нейтральный тон
    - id: Q5
      topic: scope
      question: Что для вас «первая играбельная версия» — можно играть вдвоём на нашем хосте без красоты, или нужны ещё правила и обучение?
      why: граница этапа M0
      default: играть вдвоём на нашем хосте, правила одной страницей
  accounts:
    - id: A1
      what: хост для игрового сервера (droplet ≥ 2 ГБ с Node 20 или PaaS)
      why: WebSocket-сервер — долгоживущий процесс; статический droplet Node не запускает
      needed_by: M0
      without_it: разработка и e2e-плейтесты локально у диспетчера; M0 не выкладывается
      who_creates: owner
      hand_over: "ssh-доступ диспетчеру (публичный ключ reservememes в authorized_keys) и имя хоста в product.yaml deploy.host"
    - id: A2
      what: репозиторий игры в GitHub-организации команды
      why: ветки задач, merge, тесты, деплой из git
      needed_by: M0
      without_it: ничего — команда создаёт сама
      who_creates: team
      hand_over: "URL в product.yaml repo.url"
    - id: A3
      what: поддомен (например, fleets.bymachines.ai) → хост из A1
      why: адрес игры и TLS
      needed_by: M0
      without_it: игра доступна по IP хоста для плейтестов
      who_creates: owner
      hand_over: "A-запись у регистратора; имя в product.yaml host"
  assumptions:
    - Сервер — единственный источник правды о партии; клиент не считает правила.
    - Персистентность на M0 — только память процесса плюс SQLite для кодов комнат; без аккаунтов до M2.
    - Стек по умолчанию Node 20 + TypeScript + ws + SQLite, клиент без фреймворка.
  risks:
    - Пошаговая игра на 10 минут при 1 на 1 требует второго игрока здесь и сейчас; без матчмейкинга онлайн пустует.
    - Баланс пяти типов кораблей не прочитать без партий — первые таблицы будут гипотезой game-designer'а.

plan:
  vision_md: |
    # Два флота — VISION

    **Статус:** черновик 2026-11-20 из онбординга (сухой прогон); утверждает владелец.
    **Профиль:** игра (сетевая, браузерная, сервер состояния). **Этап сейчас:** M0.

    ## Что это
    Пошаговая тактика 1 на 1 в браузере: поле 8×8, у каждого пять кораблей с разной дальностью хода и выстрела, партия ~10 минут, вход по коду комнаты без регистрации.

    ## Ядро игры
    Каждый ход — одно перемещение и один выстрел; интерес — в позиционировании кораблей разной дальности. Подробно — `GAME-DESIGN.md` (роль game-designer).

    ## Для кого и зачем
    | Игрок | Приходит с | Получает | Успех |
    |---|---|---|---|
    | двое знакомых с телефонами | ссылкой или кодом комнаты | партию на 10 минут без установки и регистрации | партия доиграна до конца |

    ## Что обещаем и чего не обещаем
    - На каждой странице: «сделано ИИ-агентами». Без регистрации до M2, без трекинга, без форм с персональными данными.
    - Сервер — единственный источник правды; невалидный ход отвергается сервером.
    - Переподключение возвращает в партию (M1). Чего не делаем: платежи, чат с незнакомыми.

    ## Этапы
    | Этап | Что значит «готово» | Что включается |
    |---|---|---|
    | M0 | двое входят по коду, играют партию до конца; ход виден сопернику ≤ 1 с; работает на телефоне 360 px | developer, designer, game-designer, tester, analyst |
    | M1 | переподключение; 10 одновременных партий; страница правил; p95 ≤ 300 мс | persona, seo |
    | M2 | ник + рейтинг; метрики возвратов; маркетинг | marketer, editor, geo, voice; правило гипотез |
    | M3 | рост G1–G4 | всё |

    ## Постоянные направления (задачи ставит сам диспетчер; `product.yaml: standing`)
    Когда задача направления закрыта и прошёл интервал, диспетчер создаёт следующую без PO; PO их не дублирует.
    | Направление | Роль | Как часто | С этапа | Что получается |
    |---|---|---|---|---|
    | `mechanics` — необычные механики кораблей и эффекты на поле | game-designer | раз в 60 ч | M1 | каталог идей `design/ideas/mechanics.md`; на прототип — не больше одной механики за раз |
    | `balance` — автобаланс по симуляции и по реальным партиям | game-designer | раз в 24 ч | M1 | `design/reports/balance.md`: «в пределах порогов» с числами или патч одного рычага в `design/balance/*.json` |

    Новая механика входит в игру только так: идея в каталоге → прототип за флагом в таблицах баланса → отчёт симуляции в коридоре баланса → tester играет → включение по умолчанию. Коридор баланса: доля побед типа корабля 0,45–0,55 при числе выборов ≥ 30.

    ## Цели (с M1)
    | id | Метрика | Определение | База | Цель | Как считаем |
    |---|---|---|---|---|---|
    | G1 | партии | начатых партий / день | 0 | 10 | `/_team/metrics.json` |
    | G2 | завершённые | доля доигранных партий | 0 | ≥ 70 % | то же |
    | G3 | возвраты | устройства, игравшие раньше | 0 | 3 / день | то же |
    | G4 | задержка | p95 ход → показ у соперника | — | ≤ 300 мс | tester |

    ## Стек и репозиторий
    Node 20 + TypeScript + `ws` + SQLite, клиент DOM/Canvas без фреймворка, Playwright для e2e. Репозиторий создаёт команда (A2). Протокол — `PROTOCOL.md`.

    ## Аккаунты и доступы
    | Что | Решение | Когда нужно | Пока нет |
    |---|---|---|---|
    | хост игрового сервера (A1) | позже | M0 | разработка и e2e локально |
    | репозиторий (A2) | команда | M0 | — |
    | поддомен (A3) | позже | M0 | по IP хоста |

    ## Каналы и тон (с M2)
    Каналы не выбраны. Тон нейтральный, условные корабли.

    ## Глубина доработок
    L0 сервер жив · L1 дефекты плейтестов · L2 задачи M0–M1 · L3 баланс по design-spec · L4 — только владелец.

    ## Разрешения ролей
    Developer/designer — код на ветке задачи · диспетчер — merge и деплой после тестов · tester — играет, не меняет · game-designer — GAME-DESIGN.md · владелец — цели, аккаунты, деньги.

    ## Бюджет
    ≤ $20/день; `STOP` в папке продукта останавливает цикл.
  game_design_md: ""
  product:
    profile: game
    stage: M0
    stack: Node 20 + TypeScript + ws + SQLite; client DOM/Canvas; Playwright e2e
    repo:
      kind: service
      url: ""
      run_cmd: npm run start
      build_cmd: npm run build
      test_cmd: npm test
      health_path: /healthz
      port: 8080
    deploy:
      mode: pending
      host: ""
    phase_gates:
      marketing: M2
      seo: M1
      persona: M1
      geo: M2
      voice: M2
  backlog:
    - title: "GAME-DESIGN.md v1: правила, пять кораблей, условие победы, таблица баланса"
      type: design
      role: game-designer
      priority: P1
      size: M
      problem: Бриф задаёт поле 8×8 и пять кораблей разной дальности, но не правила хода, выстрела, порядка и конца партии; без документа разработчик и тестировщик понимают игру по-разному.
      scope: GAME-DESIGN.md, design/balance/ships.json
      acceptance:
        - GAME-DESIGN.md описывает ход (перемещение + выстрел), пять типов кораблей с дальностью хода и выстрела, условие конца (все корабли или 40 ходов)
        - design/balance/ships.json содержит пять записей с полями move, range, hp и комментарием «что менять, если…»
      negative_cases: []
      goal: M0
      state: ready
    - title: "Каркас репозитория: сервер ws + клиент, npm test, /healthz, PROTOCOL.md"
      type: ops
      role: developer
      priority: P1
      size: M
      problem: Репозитория нет; нужен каркас со стеком по умолчанию, чтобы задачи M0 имели куда ложиться.
      scope: package.json, src/server/, src/client/, PROTOCOL.md, tests/e2e/smoke.spec.ts, README.md
      acceptance:
        - npm test проходит; GET /healthz отвечает 200 с полем version
        - PROTOCOL.md перечисляет сообщения join/move/state/error с полями
      negative_cases: []
      goal: M0
      state: ready
      repo_only: true
    - title: "Комнаты по коду: создать, войти вторым, старт партии"
      type: milestone
      role: developer
      priority: P1
      size: M
      problem: Двое не могут встретиться без комнаты.
      scope: src/server/rooms.ts, src/client/lobby.ts, tests/e2e/rooms.spec.ts
      acceptance:
        - "Сценарий tester'а: вкладка A создаёт комнату и видит код; вкладка B вводит код и обе видят «партия началась» ≤ 1 с"
        - Третий участник по тому же коду получает отказ «комната занята»
      negative_cases: ["неверный код → сообщение об ошибке, вкладка не зависает"]
      goal: M0
      depends_on: ["Каркас репозитория: сервер ws + клиент, npm test, /healthz, PROTOCOL.md"]
      state: ready
    - title: "Ход и выстрел по GAME-DESIGN.md на сервере; клиент показывает состояние"
      type: milestone
      role: developer
      priority: P1
      size: M
      problem: Ядро игры; сервер — единственный источник правды.
      scope: src/server/game.ts, src/client/board.ts, tests/unit/game.test.ts, tests/e2e/round.spec.ts
      acceptance:
        - "Сценарий tester'а: ход в вкладке A виден во вкладке B ≤ 1 с; невалидный ход отвергнут сервером и не меняет поле"
        - Партия завершается по условию из GAME-DESIGN.md с экраном результата у обоих
      negative_cases: ["ход не в свою очередь отвергается"]
      goal: M0
      depends_on: ["GAME-DESIGN.md v1: правила, пять кораблей, условие победы, таблица баланса", "Комнаты по коду: создать, войти вторым, старт партии"]
      state: ready
    - title: "DESIGN.md и раскладка поля 8×8 для телефона 360 px портрет"
      type: design
      role: designer
      priority: P2
      size: S
      problem: Поле и панель кораблей должны читаться на телефоне без зума.
      scope: DESIGN.md, src/client/styles/, src/client/assets/ships.svg
      acceptance:
        - "Скриншот tester'а 360×740: поле целиком, панель кораблей, кнопка хода без горизонтальной прокрутки"
      negative_cases: []
      goal: M0
      depends_on: ["Каркас репозитория: сервер ws + клиент, npm test, /healthz, PROTOCOL.md"]
      state: ready
    - title: "Деплой сервера на хост владельца и поддомен"
      type: ops
      role: developer
      priority: P1
      size: S
      problem: Без хоста M0 нельзя выложить.
      scope: deploy/, product.yaml deploy.host
      acceptance:
        - "https://<host>/healthz отвечает 200; две вкладки с разных устройств играют партию"
      negative_cases: []
      goal: M0
      state: deferred
      return_condition: владелец передал ssh-доступ к хосту (A1) и A-запись поддомена (A3)
  decisions:
    - "Q1 по умолчанию: разрыв связи — ждём 2 минуты, потом поражение"
    - "Q2 по умолчанию: конец партии — все корабли или 40 ходов по оставшимся"
    - "Q3 по умолчанию: телефон — портрет, 360 px"
    - "Q4 по умолчанию: условные корабли, нейтральный тон"
    - "Q5 по умолчанию: M0 = играть вдвоём на нашем хосте, правила одной страницей"
    - "A1, A3 — позже: задача деплоя в deferred до передачи хоста и поддомена"
    - "Стек по умолчанию: Node 20 + TypeScript + ws + SQLite"
  owner_summary_md: |
    Первым делом команда напишет правила игры (GAME-DESIGN.md), каркас репозитория и комнаты по коду; затем ход и выстрел на сервере и раскладку под телефон. Всё это делается и проверяется локально у диспетчера. Выкладка ждёт хост (A1) и поддомен (A3) — задача деплоя в `deferred`. Ориентир расхода: $8–12 в день при капе $20.
