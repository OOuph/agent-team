# agent-team: security headers shared by every pilot site.
# Installed to /etc/nginx/snippets/agent-team-headers.conf by install.sh.
# nginx does NOT inherit add_header into a location that has its own add_header,
# so every location in site.conf.template includes this snippet explicitly.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
